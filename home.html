{% extends "base.html" %}

{% block title %}
Home Planner
{% endblock %}

{% block content %}

<p class="eyebrow">
HOME INTERIOR PLANNER
</p>

<h1>
Design within your budget
</h1>


<form
    id="form"
    class="planner"
>

<label>

Budget (₹)

<input
    id="budget"
    type="number"
    min="1"
    required
>

</label>


<label>

Rooms

<select
    id="rooms"
    multiple
    required
>

<option>
Living Room
</option>

<option>
Bedroom
</option>

<option>
Kitchen
</option>

<option>
Dining Room
</option>

<option>
Study
</option>

</select>

</label>


<label>

Style

<select id="style">

<option>
Modern
</option>

<option>
Minimalist
</option>

<option>
Traditional
</option>

<option>
Industrial
</option>

<option>
Bohemian
</option>

</select>

</label>


<label>

Priorities

<input
    id="priorities"
    placeholder="storage, lighting, comfort"
>

</label>


<button class="btn">
Generate plan
</button>

</form>


<div id="result"></div>

{% endblock %}


{% block scripts %}

<script>

document
.querySelector("#form")
.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        const rooms = [
            ...document
                .querySelector("#rooms")
                .selectedOptions
        ].map(
            x => x.value
        );


        const r = await api(
            "/generate-home",
            {
                method: "POST",

                body: JSON.stringify({

                    budget:
                        Number(
                            budget.value
                        ),

                    rooms,

                    style:
                        style.value,

                    priorities:
                        priorities.value
                        .split(",")
                        .map(
                            x => x.trim()
                        )
                        .filter(Boolean),

                    quantities: {}

                })
            }
        );


        renderResult(r);

    }
);

</script>

{% endblock %}
