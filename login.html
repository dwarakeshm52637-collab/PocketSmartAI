{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-card">

<h1>
Welcome back
</h1>

<form id="form">

<label>
Email

<input
    name="email"
    type="email"
    required
>

</label>


<label>
Password

<input
    name="password"
    type="password"
    required
>

</label>


<button class="btn">
Login
</button>


<p
    id="msg"
    class="msg"
></p>

</form>


<p>
New user?
<a href="/register">
Create an account
</a>
</p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
.querySelector("#form")
.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        const f = e.target;

        const r = await api(
            "/login",
            {
                method: "POST",

                body: JSON.stringify({
                    email: f.email.value,
                    password: f.password.value
                })
            }
        );

        if (r.ok) {

            location.href =
                "/dashboard";

        } else {

            document
                .querySelector("#msg")
                .textContent =
                r.data.detail ||
                "Login failed";
        }
    }
);

</script>

{% endblock %}
