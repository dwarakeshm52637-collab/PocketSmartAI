{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-card">

<h1>
Create your account
</h1>

<form id="form">

<label>
Name

<input
    name="name"
    minlength="2"
    required
>

</label>


<label>
Email

<input
    name="email"
    type="email"
    required
>

</label>


<label>
Password

<input
    name="password"
    type="password"
    minlength="8"
    required
>

</label>


<button class="btn">
Register
</button>


<p
    id="msg"
    class="msg"
></p>

</form>


<p>
Already registered?

<a href="/login">
Login
</a>

</p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
.querySelector("#form")
.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        const f = e.target;

        const r = await api(
            "/register",
            {
                method: "POST",

                body: JSON.stringify({

                    name: f.name.value,

                    email: f.email.value,

                    password: f.password.value

                })
            }
        );

        if (r.ok) {

            location.href =
                "/dashboard";

        } else {

            document
                .querySelector("#msg")
                .textContent =
                r.data.detail ||
                "Registration failed";
        }
    }
);

</script>

{% endblock %}
