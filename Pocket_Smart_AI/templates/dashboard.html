{% extends "base.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div
    id="dashboard"
    class="empty"
>
Loading...
</div>

{% endblock %}


{% block scripts %}

<script>

(async()=>{

    const r =
        await api(
            "/session-info"
        );

    if (!r.ok) {

        location.href =
            "/login";

        return;
    }

    const n =
        escapeHtml(
            r.data.user.name
        );

    document
        .querySelector("#dashboard")
        .outerHTML = `

<section>

<p class="eyebrow">
DASHBOARD
</p>

<h1>
Hello, ${n} 👋
</h1>

<p>
Choose a planner.
</p>

<div class="grid three">

<a
    class="card"
    href="/planner/home"
>

<h2>
🏠 Home
</h2>

<p>
Interior planning
</p>

</a>


<a
    class="card"
    href="/planner/party"
>

<h2>
🎉 Party
</h2>

<p>
Event planning
</p>

</a>


<a
    class="card"
    href="/planner/jewelry"
>

<h2>
💎 Jewelry
</h2>

<p>
Occasion styling
</p>

</a>

</div>

</section>`;

})();

</script>

{% endblock %}
