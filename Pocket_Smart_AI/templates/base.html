<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

PocketSmart AI

</title>

<link
    rel="stylesheet"

>

</head>

<body>

<header class="nav">

<a
    class="brand"
    href="/"
>

</a>

<nav>

</a>

<a href="/planner/party">

</a>

<a href="/planner/jewelry">
    Jewelry
</a>

<a href="/history">
    History
</a>

</a>

    href="/login"
>
    Login
</a>

<button

    class="link-btn"
    hidden

</button>

<main class="container">

{% block scripts %}
