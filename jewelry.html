{% extends "base.html" %}

{% block title %}
Jewelry Planner
{% endblock %}

{% block content %}

<p class="eyebrow">
JEWELRY PLANNER
</p>

<h1>
Find occasion-ready ideas
</h1>


<form
    id="form"
    class="planner"
    enctype="multipart/form-data"
>

<label>

Budget (₹)

<input
    name="budget"
    type="number"
    min="1"
    required
>

</label>


<label>

Occasion

<input
    name="occasion"
    required
    placeholder="Wedding, festival, party"
>

</label>


<label>

Style

<select name="style">

<option>
Elegant
</option>

<option>
Minimalist
</option>

<option>
Traditional
</option>

<option>
Statement
</option>

<option>
Contemporary
</option>

</select>

</label>


<label>

Metal

<select name="metal">

<option>
Any
</option>

<option>
Gold
</option>

<option>
Silver
</option>

<option>
Rose Gold
</option>

</select>

</label>


<label>

Outfit notes

<textarea
    name="outfit_notes"
></textarea>

</label>


<label>

Optional outfit image

<input
    name="outfit_image"
    type="file"
    accept="image/*"
>

</label>


<button class="btn">
Generate suggestions
</button>

</form>


<div id="result"></div>

{% endblock %}


{% block scripts %}

<script>

document
.querySelector("#form")
.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        const r = await api(
            "/generate-jewelry",
            {
                method: "POST",

                body:
                    new FormData(
                        e.target
                    )
            }
        );

        renderResult(r);

    }
);

</script>

{% endblock %}
